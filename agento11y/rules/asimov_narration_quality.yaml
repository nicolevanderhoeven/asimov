# Agent Observability rule: dice fidelity and GM table rules on narrations.
# Sampling picks whole conversations, so a low rate leaves small experiment
# arms with no scores at all; it judges every conversation.
rule_id: asimov_narration_quality
enabled: true
selector: all_assistant_generations
sample_rate: 1.0
evaluator_ids:
  - asimov_dice_fidelity
  - asimov_gm_voice
match:
  agent_name:
    - asimov-enterprise-go
  tags.component:
    - narration
