services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.150.1
    env_file:
      - ../.env
    volumes:
      - ./otel-config.yml:/etc/otel/config.yml:ro
    command:
      - '--config=/etc/otel/config.yml'
    ports:
      # Localhost only: the OTLP receivers are unauthenticated and forward
      # to your Grafana Cloud stack with your credentials.
      - "127.0.0.1:4317:4317" # OTLP/gRPC
      - "127.0.0.1:4318:4318" # OTLP/HTTP
    networks:
      - otel-collector
networks:
  otel-collector:
